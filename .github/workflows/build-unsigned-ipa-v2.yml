name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-unsigned-ipa:
    name: Build unsigned IPA on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: "stable"

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build unsigned iOS app (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -e
          cd build/ios/Release-iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -r -9 "$GITHUB_WORKSPACE/qplayer-unsigned.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh qplayer-unsigned.ipa

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: qplayer-unsigned-ipa
          path: qplayer-unsigned.ipa
          retention-days: 90
